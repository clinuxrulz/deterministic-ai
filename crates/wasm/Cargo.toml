[package]
name = "xorae-wasm"
description = "wasm-bindgen bridge for xorae model inference"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-pack downloads prebuilt wasm-opt binaries, but none exist for Termux/Android.
# Skip the optimisation pass so `pnpm dev`/`pnpm build` work on this platform.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
xorae-core = { path = "../core" }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
