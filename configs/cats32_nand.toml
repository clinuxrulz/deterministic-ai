# NAND-only circuit. Every gate is identical; the ONLY learned quantity is
# which two wires each gate reads. This is the minimal search space.
#
# 32x32 -> 16x32 -> 16x16 -> 8x16 (128-bit key) -> mirror. 2,688 NAND gates.
image_size = 32
key_bits = 128
hidden = [512, 256]

epochs = 200
batch = 64
lr = 0.01

# Candidate wires per gate: 9 from the local window, 3 long-range.
n_local = 9
n_global = 3
# 30% of long-range candidates come from an earlier layer (skip connection).
skip_prob = 0.30

# Soft penalty pulling activations to 0/1 so the exported NAND circuit matches.
binarize_weight = 0.02
key_balance_weight = 0.05

# Anneal the candidate softmax from soft to one-hot.
gain_start = 1.0
gain_end = 32.0
anneal_fraction = 0.85

# Greedy hill-climb over the wire list after training, scoring each candidate
# swap on a fixed sample of training rows.
polish_sweeps = 2
polish_samples = 512

# Gate relaxation. `min` is the Gödel t-norm: NAND(a,b) = 1 - min(a,b).
# It makes diagonal gates exact (NAND(x,x) = 1 - x, i.e. a true NOT), which
# product (1 - a*b) does not. Over 10 paired seeds it gives test BER
# 0.1641 +- 0.0093 vs 0.1730 +- 0.0060 for `product`, at the cost of ~17% more
# gates after simplification (1,843 vs 1,572) and a higher inverter share
# (22.7% vs 34.7% -> 77.3% of gates are real two-input logic instead of 65.3%).
# Alternatives: `product` (previous default), `lukasiewicz` (much worse).
relaxation = "min"

seed = 42
log_every = 10
val_every = 25
