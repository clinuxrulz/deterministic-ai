# RGB 1-bit/channel color experiment: 8-color posterized cats.
# 16x16 x 3 channels = 768 bits; key = 128 bits.
image_size = 16
key_bits = 128
encoder_gates = 1024
decoder_gates = 1024
gate_set = "xor_and"
binarize = "threshold"
threshold = 128

population = 96
offspring = 96
generations = 1500
tournament = 4
mutation_rate = 0.01
crossover_rate = 0.10

train_batch = 512
val_batch = 512
entropy_weight = 0.05
uniqueness_weight = 0.01
parsimony_weight = 0.001

seed = 42
val_every = 25
checkpoint_every = 200
stagnation_limit = 400
log_every = 10
