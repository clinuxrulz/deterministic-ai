# Gradient-trained gate autoencoder: 32x32 grayscale, 128-bit key.
#
# Encoder: 32x32 -> 16x32 -> 16x16 -> 8x16 (128-bit key)
# Decoder: mirror. Total 2,688 literal gates.
image_size = 32
key_bits = 128
hidden = [512, 256]

epochs = 300
batch = 64
lr = 0.01

# 25% of gate inputs are drawn globally; the rest stay spatially local.
global_mix = 0.25
# Keep the encoder from collapsing every image onto one key.
key_balance_weight = 0.05
# Hardware budget: at most 10% non-linear (AND/OR) gates.
and_budget = 0.10

seed = 42
log_every = 10
val_every = 25
