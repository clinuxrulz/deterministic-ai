# NAND-only wiring search on colour: 16x16 planar RGB, 8 colours.
#
# Input  = 16x16 x 3 channels = 768 bits, stacked as a 48x16 plane.
# Hidden = 384 -> 192, key = 96 bits => 8x compression (same ratio as the
# 32x32 grayscale NAND model). Total 2,016 NAND gates.
image_size = 16
channels = 3
key_bits = 96
hidden = [384, 192]

epochs = 200
batch = 64
lr = 0.01

n_local = 9
n_global = 3
skip_prob = 0.30

binarize_weight = 0.02
key_balance_weight = 0.05

gain_start = 1.0
gain_end = 32.0
anneal_fraction = 0.85

polish_sweeps = 2
polish_samples = 512

seed = 42
log_every = 10
val_every = 25
