# NAND-only colour at 6x compression, for a head-to-head with the GA RGB1 model.
# Input 768 bits (16x16 planar RGB), hidden 384 -> 192 -> 128, key 128 bits.
image_size = 16
channels = 3
key_bits = 128
hidden = [384, 192, 128]

epochs = 200
batch = 64
lr = 0.01

n_local = 9
n_global = 3
skip_prob = 0.30

binarize_weight = 0.02
key_balance_weight = 0.05

gain_start = 1.0
gain_end = 32.0
anneal_fraction = 0.85

polish_sweeps = 0
polish_samples = 512

seed = 42
log_every = 10
val_every = 25
