# 4x4 full 8-bit RGB, 96-bit key: 4x compression (rate control).
#
# Identical to cats4_rgb8.toml except the key is twice as large, with the
# hidden widths kept at the same 8x ratio to the input. The 8x run scores
# 0.2382 abs MAE against a 0.1665 mean-image bar, so this checks whether the
# bottleneck is the rate rather than the wiring.
#
# 4x4x24 (384) -> [192, 96] -> 96 key bits -> [192, 96] -> 384
# 2*(192+96) + 384 + 96 = 1,056 NAND gates.
image_size = 4
channels = 24
key_bits = 96
hidden = [192, 96]

epochs = 200
batch = 64
lr = 0.01

n_local = 9
n_global = 3
skip_prob = 0.30

binarize_weight = 0.02
key_balance_weight = 0.05

gain_start = 1.0
gain_end = 32.0
anneal_fraction = 0.85

polish_sweeps = 2
polish_samples = 512

relaxation = "product"

seed = 42
log_every = 10
val_every = 25
