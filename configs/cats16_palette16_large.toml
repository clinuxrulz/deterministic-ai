# Larger Phase 1 palette run: 128-bit key, 2048+2048 gates, 512-image batch.
image_size = 16
key_bits = 128
encoder_gates = 2048
decoder_gates = 2048
gate_set = "xor_and"
binarize = "threshold"
threshold = 128

population = 64
offspring = 64
generations = 2000
tournament = 4
mutation_rate = 0.008
crossover_rate = 0.10

train_batch = 512
val_batch = 512
entropy_weight = 0.05
uniqueness_weight = 0.01
parsimony_weight = 0.001

seed = 42
val_every = 25
checkpoint_every = 200
stagnation_limit = 400
log_every = 10
