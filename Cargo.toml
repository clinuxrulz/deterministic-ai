[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/clinuxrulz/deterministic-ai"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = "0.25"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
